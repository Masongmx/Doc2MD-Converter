name: 💡 功能建议 / 需求提报 (Feature Request)
description: 提出新功能、新格式支持或体验改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出你的宝贵构想！
  - type: textarea
    id: problem
    attributes:
      label: 业务场景 / 遇到的痛点
      description: 这个需求是为了解决什么办公场景或问题？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的解决方案
      description: 你希望这个功能如何工作，预期交互或输出格式是怎样的？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其他备选方案或参考
      description: 是否有其他类似工具的参考做法？
    validations:
      required: false
